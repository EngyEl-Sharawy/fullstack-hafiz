<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafiz-Login</title>
  <!-- Fonts for arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lateef:wght@200;300;400;500;600;700;800&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <!-- CSS File -->
  <link rel="stylesheet" href="css/arabic.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/login_register.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="wrapper">
    <h1>حافظ</h1>
    <hr>
    <p id="error-message"></p>
    <form id="form">
      <h2>أهلا بعودتك مرة تانية !</h2>
      <div class="inputBox">
        <input type="email" name="email" id="email-input" placeholder="الايميل الالكتروني">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="inputBox">
        <input type="password" name="password" id="password-input" placeholder="كلمة المرور">
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="submit" class="btn">تسجيل دخول</button>
    </form> 
    <div>
      <p>ليس لديك حساب؟ <a href="register.html">حساب جديد</a></p>
    </div>
  </div>
  <script src="js/ui-renderer.js"></script>
</body>
</html>
